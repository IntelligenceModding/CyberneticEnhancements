name: Feature Request
description: Suggest a new feature or improvement for Cybernetic Enhancements
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Cybernetic Enhancements.

        Please describe the idea clearly and explain how it would improve the project.

  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What would you like to see added or changed?
      placeholder: Describe the implant, NPC interaction, dialogue, contract, puzzle, interface, or compatibility improvement.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain what this would improve or what use case it would support.
      placeholder: Explain why this feature would be useful.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Suggested Behavior or Design
      description: Explain how you imagine the feature working or looking.
      placeholder: Describe your suggested implementation or design.

  - type: textarea
    id: progression
    attributes:
      label: Progression and compatibility
      description: If relevant, explain the effect on balance, existing saves, multiplayer, and current progression. Alpha changes can be substantial, but their impact should be clear.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add screenshots, mockups, examples, links, or other references if useful.

  - type: input
    id: version
    attributes:
      label: Relevant Minecraft Version
      description: If this request relates to a specific Minecraft version, enter it here.
      placeholder: "Example: 1.21.1 or N/A"

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same suggestion.
          required: true
        - label: This request is related to Cybernetic Enhancements and fits the general purpose of the project.
          required: true
